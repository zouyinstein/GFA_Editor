<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GFA Editor v1.3.2</title>
    <link rel="stylesheet" href="/styles.css?v=20260617-v132-r1" />
    <script src="/vendor/cytoscape.min.js"></script>
    <script src="/vendor/d3.min.js"></script>
    <script src="/vendor/lucide.min.js"></script>
    <script src="/app.js?v=20260617-v132-r1" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-icon" src="/app-icon.png" alt="" />
          <div>
            <h1>GFA Editor v1.3.2</h1>
            <span id="source-name">No GFA loaded</span>
          </div>
        </div>
      </header>

      <aside class="sidebar">
        <section class="panel stats-panel">
          <h2>Stats</h2>
          <div id="stats-grid" class="stats-grid"></div>
          <svg id="depth-histogram" class="histogram" role="img" aria-label="Depth histogram"></svg>
        </section>

        <section class="panel">
          <h2>Import</h2>
          <form id="gfa-upload-form" class="stack">
            <div class="inline-action-row import-row">
              <label class="file-picker compact inline-picker">
                <input id="gfa-file" type="file" accept=".gfa,.txt" required />
                <i data-lucide="file-up"></i>
                <span id="gfa-file-label">Choose GFA</span>
              </label>
              <button class="primary-button compact-action" type="submit">
                <i data-lucide="upload"></i><span>Load</span>
              </button>
            </div>
            <label class="check-row">
              <input id="keep-sequences" type="checkbox" checked />
              <span>Keep sequences for GFA/FASTA export</span>
            </label>
            <label class="check-row compact-check">
              <input id="auto-split-large-gfa" type="checkbox" checked />
              <span>Auto-split large GFA</span>
            </label>
            <label class="field compact-field">
              <span>Remaining part size</span>
              <input id="remaining-chunk-size" type="number" min="1" max="5000" step="1" value="50" />
            </label>
            <div id="split-summary" class="split-summary" hidden></div>
          </form>
        </section>

        <section class="panel">
          <h2>Labels</h2>
          <div class="label-grid compact-label-grid">
            <label><input id="label-name" type="checkbox" checked /> Name</label>
            <label><input id="label-length" type="checkbox" /> Length</label>
            <label><input id="label-depth" type="checkbox" /> Depth</label>
            <label><input id="label-blast" type="checkbox" /> Alignments</label>
            <label><input id="show-link-labels" type="checkbox" checked /> Link label</label>
            <label><input id="text-outline" type="checkbox" checked /> Text outline</label>
          </div>
        </section>

        <section class="panel">
          <h2>Alignments</h2>
          <form id="blast-upload-form" class="stack">
            <label class="field">
              <span>Tool</span>
              <select id="alignment-tool">
                <option value="minimap2">minimap2</option>
                <option value="blastn">blastn</option>
              </select>
            </label>
            <label class="field">
              <span>Preset</span>
              <select id="alignment-preset"></select>
            </label>
            <div class="inline-action-row alignment-run-row">
              <label class="file-picker compact inline-picker">
                <input id="query-fasta-file" type="file" accept=".fa,.fasta,.fq,.fastq,.fna,.gz" />
                <i data-lucide="file-search"></i>
                <span id="query-fasta-file-label">Choose query</span>
              </label>
              <button id="alignment-run-button" class="primary-button compact-action" type="button" disabled>
                <i data-lucide="play"></i><span>Run</span>
              </button>
            </div>
            <label class="field">
              <span>Read</span>
              <select id="alignment-read-select" disabled>
                <option value="__all__">All reads</option>
              </select>
            </label>
            <label class="check-row compact-check">
              <input id="alignment-show-background" type="checkbox" checked />
              <span>Light hit background</span>
            </label>
            <details class="advanced-tools alignment-query-tools">
              <summary>Query colours</summary>
              <div id="alignment-query-list" class="alignment-query-list"></div>
            </details>
            <details class="advanced-tools">
              <summary>Advanced</summary>
              <div class="stack compact-stack">
                <label class="field">
                  <span>Extra args</span>
                  <input id="alignment-extra-args" type="text" />
                </label>
                <label class="field">
                  <span>Import format</span>
                  <select id="alignment-result-format">
                    <option value="paf">PAF</option>
                    <option value="blast6">BLAST outfmt 6</option>
                  </select>
                </label>
                <label class="field">
                  <span>Map results to</span>
                  <select id="alignment-target-role">
                    <option value="subject">Subject/target contigs</option>
                    <option value="query">Query contigs</option>
                  </select>
                </label>
                <label class="field">
                  <span>Command</span>
                  <textarea id="alignment-command" rows="4" readonly></textarea>
                </label>
                <label class="file-picker compact">
                  <input id="blast-file" type="file" accept=".tsv,.txt,.blast,.paf" />
                  <i data-lucide="database-zap"></i>
                  <span id="blast-file-label">Choose alignment result</span>
                </label>
                <button id="blast-upload-button" class="tool-button full" type="submit" disabled>
                  <i data-lucide="layers"></i><span>Import alignments</span>
                </button>
              </div>
            </details>
          </form>
        </section>
      </aside>

      <main class="workspace">
        <div class="graph-toolbar">
          <div class="graph-toolbar-left">
            <div class="segmented layout-mode-group" aria-label="Visualization mode">
              <button class="layout-button active" type="button" data-layout="cose" title="Cose view" aria-label="Cose view">
                <svg class="layout-mode-icon" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
                  <path class="layout-mode-link" d="M8 10.5 14.5 6.5 21 12.5 17 21 7.5 18z" />
                  <path class="layout-mode-link" d="M8 10.5 17 21M14.5 6.5 7.5 18" />
                  <circle cx="8" cy="10.5" r="2.1" />
                  <circle cx="14.5" cy="6.5" r="2.1" />
                  <circle cx="21" cy="12.5" r="2.1" />
                  <circle cx="17" cy="21" r="2.1" />
                  <circle cx="7.5" cy="18" r="2.1" />
                </svg>
              </button>
              <button class="layout-button is-locked" type="button" data-layout="bandage_native" title="Band view" aria-label="Band view" aria-disabled="true" disabled>
                <svg class="layout-mode-icon" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
                  <path class="layout-mode-band" d="M5.5 19.5 C8.5 8.5 15.5 7 22.5 11.5" />
                  <path class="layout-mode-band" d="M7 20.5 C12.5 22.5 18.5 20.5 22.5 15" />
                  <circle cx="5.5" cy="19.5" r="1.8" />
                  <circle cx="22.5" cy="11.5" r="1.8" />
                  <circle cx="22.5" cy="15" r="1.8" />
                </svg>
              </button>
              <button class="layout-button is-locked" type="button" data-layout="twin" title="Twin view" aria-label="Twin view" aria-disabled="true" disabled>
                <svg class="layout-mode-icon" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
                  <path class="layout-mode-divider" d="M14 4.5v19" />
                  <path class="layout-mode-link" d="M5.5 11 10 8.5 11.5 15.5 6.5 18.5z" />
                  <circle cx="5.5" cy="11" r="1.55" />
                  <circle cx="10" cy="8.5" r="1.55" />
                  <circle cx="11.5" cy="15.5" r="1.55" />
                  <circle cx="6.5" cy="18.5" r="1.55" />
                  <path class="layout-mode-band" d="M18 19.5 C16.5 12 20 7.5 24 9.5" />
                  <path class="layout-mode-band" d="M18.5 20 C22 22 24.5 18.5 23 14.5" />
                </svg>
              </button>
            </div>
            <label id="subgraph-selector-wrap" class="subgraph-selector" hidden>
              <span>Subgraph</span>
              <select id="subgraph-select"></select>
            </label>
            <div class="display-menu">
              <button
                id="graph-display-toggle"
                class="tool-button compact-tool icon-only-tool"
                type="button"
                title="Graph display"
                aria-label="Graph display"
                aria-expanded="false"
                aria-controls="graph-display-panel"
              >
                <i data-lucide="sliders-horizontal"></i>
              </button>
              <div id="graph-display-panel" class="display-popover" hidden>
                <label class="field">
                  <span>Zoom (%)</span>
                  <input id="zoom-level" type="number" min="5" max="500" step="5" value="100" />
                </label>
                <label class="field">
                  <span>Circle size</span>
                  <input id="node-size-scale" type="range" min="0.45" max="3" step="0.05" value="1" />
                </label>
                <label class="field">
                  <span>Contig width</span>
                  <input id="node-width" type="range" min="6" max="56" step="1" value="18" />
                </label>
                <label class="field">
                  <span>Link width</span>
                  <input id="link-width-scale" type="range" min="0.4" max="4" step="0.05" value="1" />
                </label>
              </div>
            </div>
            <div class="display-menu">
              <button
                id="graph-filter-toggle"
                class="tool-button compact-tool icon-only-tool"
                type="button"
                title="Graph filters"
                aria-label="Graph filters"
                aria-expanded="false"
                aria-controls="graph-filter-panel"
              >
                <i data-lucide="list-filter"></i>
              </button>
              <div id="graph-filter-panel" class="display-popover filter-popover" hidden>
                <label class="field">
                  <span>Node search</span>
                  <input id="node-search" type="search" placeholder="contig / reference" />
                </label>
                <div class="radio-row" role="radiogroup" aria-label="Match mode">
                  <label><input type="radio" name="match-mode" value="partial" checked /> Partial</label>
                  <label><input type="radio" name="match-mode" value="exact" /> Exact</label>
                </div>
                <button id="find-node-button" class="tool-button full" type="button" disabled>
                  <i data-lucide="search"></i><span>Find node(s)</span>
                </button>
                <div class="field-grid even-grid">
                  <label class="field">
                    <span>Min depth</span>
                    <input id="min-depth" type="number" value="0" min="0" step="1" />
                  </label>
                  <label class="field">
                    <span>Color by</span>
                    <select id="color-mode">
                      <option value="depth">Depth</option>
                      <option value="alignment">Alignment identity</option>
                      <option value="read_path">Long-read paths</option>
                      <option value="degree">Degree</option>
                      <option value="random">Random</option>
                    </select>
                  </label>
                </div>
              </div>
            </div>
            <div class="display-menu">
              <button
                id="server-files-toggle"
                class="tool-button compact-tool icon-only-tool"
                type="button"
                title="Server files"
                aria-label="Server files"
                aria-expanded="false"
                aria-controls="server-files-panel"
              >
                <i data-lucide="folder-sync"></i>
              </button>
              <div id="server-files-panel" class="display-popover server-popover" hidden>
                <div class="subsection">
                  <h3>SFTP</h3>
                  <div class="field-grid">
                    <label class="field">
                      <span>Host</span>
                      <input id="sftp-host" type="text" placeholder="192.168.1.10" />
                    </label>
                    <label class="field compact-field">
                      <span>Port</span>
                      <input id="sftp-port" type="number" min="1" max="65535" value="22" />
                    </label>
                  </div>
                  <div class="field-grid">
                    <label class="field">
                      <span>Username</span>
                      <input id="sftp-username" type="text" autocomplete="username" />
                    </label>
                    <label class="field">
                      <span>Password</span>
                      <input id="sftp-password" type="password" autocomplete="current-password" />
                    </label>
                  </div>
                  <label class="field">
                    <span>Remote path</span>
                    <input id="sftp-remote-path" type="text" placeholder="/data/sample.gfa" />
                  </label>
                  <div class="button-row">
                    <button id="sftp-download-button" class="tool-button" type="button">
                      <i data-lucide="download-cloud"></i><span>Download</span>
                    </button>
                    <button id="sftp-upload-button" class="tool-button" type="button" disabled>
                      <i data-lucide="upload-cloud"></i><span>Upload</span>
                    </button>
                  </div>
                </div>

                <details class="subsection local-server-tools" open>
                  <summary>Local workspace files</summary>
                  <label class="field">
                    <span>Data directory</span>
                    <input id="server-data-dir" type="text" value="Not connected" readonly />
                  </label>
                  <label class="field">
                    <span>Server GFA</span>
                    <select id="server-file-select" disabled>
                      <option value="">Refresh file list</option>
                    </select>
                  </label>
                  <div class="button-row">
                    <button id="server-refresh-button" class="tool-button" type="button">
                      <i data-lucide="refresh-cw"></i><span>Refresh</span>
                    </button>
                    <button id="server-load-button" class="tool-button" type="button" disabled>
                      <i data-lucide="folder-open"></i><span>Load</span>
                    </button>
                  </div>
                  <label class="field">
                    <span>Save as</span>
                    <input id="server-save-path" type="text" placeholder="edited.gfa" />
                  </label>
                  <button id="server-save-button" class="tool-button full" type="button" disabled>
                    <i data-lucide="save"></i><span>Save locally</span>
                  </button>
                </details>
              </div>
            </div>
          </div>
          <div class="graph-actions">
            <button id="draw-graph-toolbar-button" class="tool-button compact-tool icon-only-tool" type="button" title="Draw graph" aria-label="Draw graph" disabled>
              <i data-lucide="refresh-cw"></i>
            </button>
            <div class="display-menu drawing-menu">
              <button
                id="graph-drawing-toggle"
                class="tool-button compact-tool icon-only-tool"
                type="button"
                title="Graph drawing settings"
                aria-label="Graph drawing settings"
                aria-expanded="false"
                aria-controls="graph-drawing-panel"
              >
                <i data-lucide="settings-2"></i>
              </button>
              <div id="graph-drawing-panel" class="display-popover drawing-popover" hidden>
                <div class="inline-action-row drawing-row">
                  <label class="field inline-field no-field-label drawing-scope-field">
                    <span>Scope</span>
                    <select id="draw-scope">
                      <option value="entire">Entire graph</option>
                      <option value="visible">Visible/filter result</option>
                      <option value="selection">Selected neighborhood</option>
                    </select>
                  </label>
                  <button id="draw-graph-button" class="primary-button compact-action" type="button" disabled>
                    <i data-lucide="refresh-cw"></i><span>Draw</span>
                  </button>
                </div>
                <label class="check-row">
                  <input id="auto-redraw" type="checkbox" />
                  <span>Redraw after edits</span>
                </label>
              </div>
            </div>
            <button id="fit-button" class="icon-button" type="button" title="Fit" disabled>
              <i data-lucide="scan"></i>
            </button>
            <button id="delete-selected-button" class="danger-button" type="button" title="Delete selection" disabled>
              <i data-lucide="trash-2"></i><span>Delete</span>
            </button>
            <button id="delete-all-selected-button" class="danger-button" type="button" title="Delete all selected" disabled>
              <i data-lucide="trash"></i><span>Delete All</span>
            </button>
            <button id="undo-button" class="icon-button" type="button" title="Undo" aria-label="Undo" disabled>
              <i data-lucide="undo-2"></i>
            </button>
            <button id="redo-button" class="icon-button" type="button" title="Redo" aria-label="Redo" disabled>
              <i data-lucide="redo-2"></i>
            </button>
            <button id="duplicate-node-button" class="tool-button" type="button" title="Duplicate node and links" disabled>
              <i data-lucide="copy-plus"></i><span>Duplicate</span>
            </button>
            <button id="repeat-resolution-a-button" class="tool-button" type="button" title="Repeat resolution A" disabled>
              <i data-lucide="git-branch"></i><span>Repeat A</span>
            </button>
            <button id="repeat-resolution-b-button" class="tool-button" type="button" title="Repeat resolution B" disabled>
              <i data-lucide="git-branch"></i><span>Repeat B</span>
            </button>
            <div class="display-menu auto-repeat-menu">
              <button
                id="auto-repeat-resolution-button"
                class="tool-button compact-tool icon-only-tool"
                type="button"
                title="Auto repeat resolution"
                aria-label="Auto repeat resolution"
                aria-expanded="false"
                aria-controls="auto-repeat-resolution-panel"
                disabled
              >
                <i data-lucide="wand-sparkles"></i>
              </button>
              <div id="auto-repeat-resolution-panel" class="display-popover auto-repeat-popover" hidden>
                <label class="field">
                  <span>Result</span>
                  <select id="auto-repeat-resolution-select" disabled>
                    <option value="">No candidates</option>
                  </select>
                </label>
                <div id="auto-repeat-resolution-details" class="auto-repeat-details">No candidates</div>
                <button id="auto-repeat-resolution-apply-button" class="primary-button full" type="button" disabled>
                  <i data-lucide="check"></i><span>Apply</span>
                </button>
              </div>
            </div>
            <button id="merge-link-button" class="tool-button" type="button" title="Merge selected" disabled>
              <i data-lucide="combine"></i><span>Merge</span>
            </button>
            <button id="rotate-circular-button" class="tool-button" type="button" title="Rotate circular contig start" disabled>
              <i data-lucide="rotate-cw"></i><span>Rotate</span>
            </button>
          </div>
          <div class="graph-export-actions">
            <button id="quick-export-button" class="primary-button icon-button quick-export-action" type="button" title="Quick export with default filename" aria-label="Quick export" disabled>
              <i data-lucide="download"></i>
            </button>
            <div class="display-menu export-menu">
              <button
                id="export-menu-toggle"
                class="tool-button compact-tool icon-only-tool"
                type="button"
                title="Export options"
                aria-label="Export options"
                aria-expanded="false"
                aria-controls="export-menu-panel"
              >
                <i data-lucide="file-output"></i>
              </button>
              <div id="export-menu-panel" class="display-popover export-popover" hidden>
                <div class="button-row">
                  <button id="export-gfa-button" class="primary-button" type="button" title="Save current graph as GFA" disabled>
                    <i data-lucide="file-down"></i><span>GFA</span>
                  </button>
                  <button id="export-fasta-button" class="primary-button" type="button" title="Save current graph as FASTA" disabled>
                    <i data-lucide="file-down"></i><span>FASTA</span>
                  </button>
                </div>
                <div class="button-row">
                  <button id="export-svg-button" class="tool-button" type="button" title="Save current view as SVG" disabled>
                    <i data-lucide="image-down"></i><span>SVG</span>
                  </button>
                  <button id="export-pdf-button" class="tool-button" type="button" title="Save current view as PDF" disabled>
                    <i data-lucide="file-down"></i><span>PDF</span>
                  </button>
                </div>
                <div class="button-row">
                  <button id="export-selected-button" class="tool-button" type="button" title="Export selected links" disabled>
                    <i data-lucide="download"></i><span>Selected...</span>
                  </button>
                  <button id="export-history-button" class="tool-button" type="button" title="Export edit history JSON" disabled>
                    <i data-lucide="file-clock"></i><span>History...</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="graph" class="graph">
          <div id="cy-layer" class="cy-layer"></div>
          <svg id="bandage-svg" class="bandage-svg" aria-label="Bandage SVG graph"></svg>
          <div id="empty-state" class="empty-state">
            <strong>GFA graph</strong>
          </div>
        </div>
        <div class="statusbar">
          <span id="visible-count">0 nodes / 0 links</span>
          <span id="status-text">Ready</span>
        </div>
      </main>

      <aside class="inspector">
        <section class="panel fill">
          <div class="panel-title-row">
            <h2>Inspector</h2>
            <span id="selection-kind" class="pill">none</span>
          </div>
          <div id="selection-details" class="details"></div>
        </section>
        <section class="panel history-panel">
          <div class="panel-title-row">
            <h2>Operation Log</h2>
            <button id="clear-history-button" class="mini-button" type="button" disabled>Clear</button>
          </div>
          <div id="history-list" class="history-list"></div>
        </section>
        <section class="panel edit-history-panel">
          <h2>Edit History</h2>
          <div class="edit-history-tools">
            <label class="file-picker compact">
              <input id="history-file" type="file" accept=".json,application/json" />
              <i data-lucide="file-clock"></i>
              <span id="history-file-label">Choose history JSON</span>
            </label>
            <button id="apply-history-button" class="tool-button full" type="button" disabled>
              <i data-lucide="history"></i><span>Apply history</span>
            </button>
            <label class="file-picker compact">
              <input id="render-gfa-file" type="file" accept=".gfa,.txt" />
              <i data-lucide="file-up"></i>
              <span id="render-gfa-file-label">Input GFA</span>
            </label>
            <label class="file-picker compact">
              <input id="render-history-file" type="file" accept=".json,application/json" />
              <i data-lucide="file-clock"></i>
              <span id="render-history-file-label">Input history JSON</span>
            </label>
            <button id="render-history-button" class="tool-button full" type="button" disabled>
              <i data-lucide="file-output"></i><span>Render edited GFA</span>
            </button>
            <label class="file-picker compact">
              <input id="infer-old-gfa-file" type="file" accept=".gfa,.txt" />
              <i data-lucide="file-input"></i>
              <span id="infer-old-gfa-file-label">Old GFA</span>
            </label>
            <label class="file-picker compact">
              <input id="infer-new-gfa-file" type="file" accept=".gfa,.txt" />
              <i data-lucide="file-output"></i>
              <span id="infer-new-gfa-file-label">New GFA</span>
            </label>
            <button id="infer-history-button" class="tool-button full" type="button" disabled>
              <i data-lucide="list-tree"></i><span>Infer history</span>
            </button>
          </div>
        </section>
      </aside>
    </div>
    <div id="toast" class="toast" hidden></div>
  </body>
</html>
